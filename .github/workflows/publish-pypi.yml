name: Build and Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build distribution and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mantis-rtm
    permissions:
      id-token: write  # Required for PyPI Trusted Publishing (OIDC)
      contents: read   # Required to checkout repository

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for setuptools_scm to extract version from tags

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build source distribution and wheel
        run: python -m build

      - name: Verify distribution archives
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # PyPI Trusted Publishing (OIDC) is used automatically when permissions.id-token is set.
        # If you prefer using a classic PyPI API token instead of Trusted Publishing,
        # add a repository secret named PYPI_API_TOKEN and uncomment the line below:
        # with:
        #   password: ${{ secrets.PYPI_API_TOKEN }}
